<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <meta name="color-scheme" content="light dark">
  <meta name="pocket-offline-shell" content="navigator-public-shell-v13">
  <script src="/theme.js"></script>
  <script src="/language.js"></script>
  <title>Pocket · Waiting to connect</title>
  <style>
    :root { --background:#f7f9fc; --panel:#ffffff; --line:#e7ebf0; --ink:#1c2024; --muted:#64717d; --button-ink:#ffffff; }
    html[data-theme="dark"] { --background:#111318; --panel:#181c22; --line:#2a323d; --ink:#edeef0; --muted:#9ba7b4; --button-ink:#ffffff; }
    @media (prefers-color-scheme:dark) {
      html:not([data-theme]) { --background:#111318; --panel:#181c22; --line:#2a323d; --ink:#edeef0; --muted:#9ba7b4; --button-ink:#ffffff; }
    }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--background); -webkit-text-size-adjust:100%; }
    body {
      --side-space:max(24px, env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
      margin:0; width:100%; min-height:100vh; min-height:100dvh;
      padding:max(28px, env(safe-area-inset-top, 0px)) var(--side-space) max(28px, env(safe-area-inset-bottom, 0px));
      display:flex; flex-direction:column; align-items:center;
      background:var(--background); color:var(--ink);
      font-family:-apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    main {
      width:100%; max-width:360px; margin-block:auto; padding:32px 20px;
      display:flex; flex-direction:column; align-items:center; text-align:center;
      background:var(--panel); border:1px solid var(--line); border-radius:24px;
    }
    img { display:block; width:48px; height:48px; margin:0 0 24px; border-radius:22%; flex-shrink:0; }
    h1 { width:100%; margin:0; font-size:24px; font-weight:650; line-height:1.4; text-wrap:balance; }
    p { width:100%; margin:12px 0 0; color:var(--muted); font-size:14px; line-height:1.8; text-wrap:balance; }
    .retry {
      display:inline-flex; align-items:center; justify-content:center;
      max-width:100%; min-width:144px; min-height:48px; margin-top:28px; padding:12px 24px;
      background:#3e63dd; color:var(--button-ink); border-radius:10px;
      font-size:15px; font-weight:550; line-height:1.5; text-decoration:none; text-align:center;
      overflow-wrap:anywhere; touch-action:manipulation; -webkit-tap-highlight-color:transparent;
    }
    .retry:focus-visible { outline:2px solid var(--muted); outline-offset:4px; }
    .retry:active { opacity:.8; }
    @media (max-height:420px) and (min-width:500px) {
      img { width:48px; height:48px; margin-bottom:16px; }
      .retry { margin-top:20px; }
    }
  </style>
</head>
<body>
  <main aria-labelledby="offline-title">
    <img src="/icons/pocket-v1.svg" width="64" height="64" alt="Pocket">
    <h1 id="offline-title" data-shell-text="offlineTitle">Unable to connect</h1>
    <p data-shell-text="offlineHelp">The network or your Mac is unavailable. Try again when the connection returns.</p>
    <a href="" class="retry" data-shell-text="reconnect">Reconnect</a>
  </main>
</body>
</html>
